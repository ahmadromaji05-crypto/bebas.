<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Kuis Pembelajaran</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Kuis Edukasi Interaktif</h1>
    <div id="quiz-box">
      <div id="question" class="question-text">Memuat pertanyaan...</div>
      <div id="options" class="options-container"></div>
    </div>
    <div id="score-box" class="score-text">Skor: 0</div>
    <button id="next-btn" class="btn" style="display: none;" onclick="nextQuestion()">Pertanyaan Selanjutnya</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
